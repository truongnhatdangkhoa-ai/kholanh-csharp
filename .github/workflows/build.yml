name: Build KhoLanh.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Kiểm thử
        run: dotnet test tests/KhoLanh.Core.Tests -c Release
      - name: Kiểm tra Apps Script tài khoản dùng chung
        run: node tests/apps-script/kiem-tra.js
      - name: Đóng gói Windows (1 file .exe nén, không cần cài .NET)
        run: |
          dotnet publish src/KhoLanh.App -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/win-x64
          cd publish/win-x64 && sha256sum KhoLanh.exe | cut -d' ' -f1 > KhoLanh.exe.sha256 && cat KhoLanh.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: KhoLanh-win-x64
          path: |
            publish/win-x64/KhoLanh.exe
            publish/win-x64/KhoLanh.exe.sha256


  tu-kiem-windows:
    # Chạy thật bản đóng gói trên Windows: kiểm tra cơ chế tự cập nhật (thay exe, giữ bản .cu).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Đóng gói
        run: dotnet publish src/KhoLanh.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
      - name: Tự kiểm tra thay exe khi cập nhật
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\capnhat"; New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item publish\KhoLanh.exe "$t\KhoLanh.exe"; Copy-Item publish\KhoLanh.exe "$t\KhoLanh.exe.moi"
          '{"version":"99.0.0"}' | Set-Content "$t\KhoLanh.exe.moi.json"
          $env:KHOLANH_DATA = "$t\data"; $env:KHOLANH_TU_KIEM_THOAT = "1"
          Start-Process -FilePath "$t\KhoLanh.exe" -Wait
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$t\data\da-cap-nhat.txt"); $i++) { Start-Sleep -Seconds 1 }
          Get-ChildItem $t | Format-Table Name, Length
          if (-not (Test-Path "$t\data\da-cap-nhat.txt")) { throw 'Bản mới không được mở lại' }
          if (-not (Test-Path "$t\KhoLanh.exe.cu")) { throw 'Không giữ bản cũ (.cu)' }
          if (Test-Path "$t\KhoLanh.exe.moi") { throw 'Bản chờ (.moi) chưa được đưa vào chỗ' }
      - name: Tự kiểm tra bấm Cập nhật khi app đang mở (cửa sổ chính)
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\capnhat2"; New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item publish\KhoLanh.exe "$t\KhoLanh.exe"; Copy-Item publish\KhoLanh.exe "$t\KhoLanh.exe.moi"
          Copy-Item publish\KhoLanh.exe "$t\KhoLanh.exe.cu"   # như máy người dùng: đã có bản trước từ lần cập nhật cũ
          '{"version":"99.0.0"}' | Set-Content "$t\KhoLanh.exe.moi.json"
          $env:KHOLANH_DATA = "$t\data"; $env:KHOLANH_TU_KIEM_THOAT = "1"
          $p = Start-Process -FilePath "$t\KhoLanh.exe" -ArgumentList '--tu-kiem-cap-nhat' -PassThru
          for ($i = 0; $i -lt 120 -and -not (Test-Path "$t\data\da-cap-nhat.txt"); $i++) { Start-Sleep -Seconds 1 }
          Get-ChildItem $t | Format-Table Name, Length
          if (Test-Path "$t\data\loi-tu-kiem.txt") { Get-Content "$t\data\loi-tu-kiem.txt"; throw 'Cập nhật báo lỗi' }
          if (Test-Path "$t\loi-cap-nhat.log") { Get-Content "$t\loi-cap-nhat.log"; throw 'Tiến trình phụ báo lỗi' }
          if (-not (Test-Path "$t\data\da-cap-nhat.txt")) { throw 'Bản mới không tự mở lại' }
          if (-not $p.HasExited) { throw 'Bản cũ chưa thoát' }
          if (Test-Path "$t\KhoLanh.exe.moi") { throw 'Bản chờ (.moi) chưa được đưa vào chỗ' }
          if (-not (Test-Path "$t\KhoLanh.exe.cu")) { throw 'Không giữ bản cũ (.cu)' }

  phat-hanh:
    # Đổi <Version> trong Directory.Build.props rồi đẩy lên main → sau khi kiểm thử + tự kiểm tra Windows đạt,
    # tự tạo bản phát hành vX.Y.Z (nếu chưa có). App ở máy người dùng tự cập nhật từ đây.
    needs: [build, tu-kiem-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Đọc phiên bản
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "moi=0" >> "$GITHUB_OUTPUT"; else echo "moi=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.moi == '1'
        with:
          name: KhoLanh-win-x64
          path: out
      - name: Tạo bản phát hành
        if: steps.ver.outputs.moi == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Kho Lạnh ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: Bản ${{ steps.ver.outputs.v }} — phần mềm tự tải và cập nhật (không cần cài lại).
          files: |
            out/KhoLanh.exe
            out/KhoLanh.exe.sha256
