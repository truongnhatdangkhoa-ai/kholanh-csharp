name: Build KhoLanh.exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Kiểm thử
        run: dotnet test tests/KhoLanh.Core.Tests -c Release
      - name: Đóng gói Windows (1 file .exe, không cần cài .NET)
        run: >
          dotnet publish src/KhoLanh.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: KhoLanh-win-x64
          path: publish/win-x64/KhoLanh.exe
      - name: Đính kèm vào bản phát hành (khi gắn tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/KhoLanh.exe

  tu-kiem-windows:
    # Mở thật 2 module gốc trong WebView2 trên Windows, kiểm tra cầu nối dữ liệu + thư viện Excel.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Đóng gói
        run: dotnet publish src/KhoLanh.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
      - name: Tự kiểm tra 2 module
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\KhoLanh.exe -ArgumentList '--tu-kiem-module', "$PWD\kq.json" -Wait -PassThru
          if (Test-Path kq.json) { Get-Content kq.json } else { Write-Host 'Không có kq.json' }
          if ($p.ExitCode -ne 0) { throw "Tự kiểm tra lỗi (mã $($p.ExitCode))" }
